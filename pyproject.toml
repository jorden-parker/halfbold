[project]
name = "halfbold"
version = "0.1.0"
description = "Turn a Regular + Bold font pair into a bionic-reading font that bolds the first half of every word"
readme = "README.md"
authors = [
    { name = "Jorden Parker", email = "jordenparker@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fonttools>=4.65.0",
]

[project.scripts]
halfbold = "halfbold.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "uharfbuzz>=0.56.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ERA"]

[tool.pytest.ini_options]
testpaths = ["tests"]
