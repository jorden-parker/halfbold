<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>halfbold</title>
    <script type="module" src="./src/main.ts" defer></script>
  </head>

  <body>
    <aside>
      <div class="sidebar-top">
        <div class="segmented" role="tablist">
          <button id="tab-installed" class="tab active" role="tab" aria-selected="true">Installed</button>
          <button id="tab-brew" class="tab" role="tab" aria-selected="false">Homebrew</button>
        </div>
        <input id="filter" type="search" placeholder="Search fonts" autocomplete="off" spellcheck="false" />
      </div>
      <ul id="list" role="listbox"></ul>
      <div id="list-note" class="list-note" hidden></div>
    </aside>
    <main>
      <section id="detail">
        <div id="empty" class="empty">
          <p class="empty-title">Nothing selected</p>
          <p class="empty-hint">Choose a font on the left. Arrow keys move, <kbd>/</kbd> searches.</p>
        </div>
        <div id="panel" hidden>
          <header class="detail-head">
            <div class="detail-titles">
              <h1 id="title"></h1>
              <p id="meta"></p>
            </div>
            <div id="actions"></div>
          </header>
          <form id="tuning" class="tuning" autocomplete="off">
            <label class="knob">
              <span class="knob-name">Bold share</span>
              <input id="knob-share" type="range" name="bold_share" min="10" max="100" step="5" />
              <output id="out-share"></output>
            </label>
            <label class="knob">
              <span class="knob-name">Shortest word bolded</span>
              <input id="knob-min" type="range" name="min_word_length" min="1" max="8" step="1" />
              <output id="out-min"></output>
            </label>
            <label class="knob knob-weight">
              <span class="knob-name">Plain weight</span>
              <input id="knob-regular" type="range" name="regular_weight" min="100" max="900" step="50" />
              <output id="out-regular"></output>
            </label>
            <label class="knob knob-weight">
              <span class="knob-name">Bold weight</span>
              <input id="knob-bold" type="range" name="bold_weight" min="100" max="900" step="50" />
              <output id="out-bold"></output>
            </label>
            <button id="reset-tuning" class="link" type="button">Reset</button>
            <span id="tuning-note" class="tuning-note"></span>
          </form>
          <div class="specimens">
            <div class="specimen">
              <div class="specimen-label"><span>Half bold</span><span id="half-note" class="specimen-note"></span></div>
              <p id="sample-half" class="sample" contenteditable="plaintext-only" spellcheck="false"></p>
            </div>
            <div class="specimen">
              <div class="specimen-label"><span>Regular</span></div>
              <p id="sample-plain" class="sample"></p>
            </div>
          </div>
          <div id="sample-tools">
            <button id="reset-sample" class="link">Reset sample text</button>
          </div>
        </div>
      </section>
      <footer id="statusbar">
        <span id="status"></span>
        <span id="slots"></span>
      </footer>
    </main>
  </body>
</html>
